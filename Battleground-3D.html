<script data-page-node-id="8WWDq0VRaXLbBNGHGfU0O5" data-pnid-children="Eb229J7iHCxEKenl1B0KwH" type="module">
import * as THREE from 'three';

// ================= 基础 =================
const MAP=1200, BOTN=99;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const d2=(ax,az,bx,bz)=>{const dx=ax-bx,dz=az-bz;return dx*dx+dz*dz;};

const WEAPONS={
  pistol:{name:"手枪",dmg:18,rof:330,spread:.012,speed:900,mag:12,reload:900,range:300,auto:false,color:0xbbbbbb},
  rifle:{name:"突击步枪",dmg:15,rof:110,spread:.02,speed:1100,mag:30,reload:1400,range:420,auto:true,color:0xffb300},
  sniper:{name:"狙击枪",dmg:80,rof:1350,spread:.001,speed:1600,mag:5,reload:2100,range:900,auto:false,color:0x4fc3f7},
  shotgun:{name:"霰弹枪",dmg:10,rof:820,spread:.07,speed:700,mag:6,reload:1800,range:90,auto:false,pellets:7,color:0xef5350},
  smg:{name:"冲锋枪",dmg:11,rof:75,spread:.03,speed:950,mag:40,reload:1300,range:240,auto:true,color:0xba68c8},
};
const LOOT=["rifle","rifle","sniper","shotgun","smg","smg","rifle"];

// ================= 场景 =================
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87b5e0);
scene.fog=new THREE.Fog(0x87b5e0,200,1600);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,2500);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

// 玩家武器模型（第一人称视角可见）— 缩小版
const playerGunG=new THREE.BoxGeometry(.1,.12,.6);
const playerGunM=new THREE.MeshLambertMaterial({color:0x222222});
const playerGun=new THREE.Mesh(playerGunG,playerGunM);
playerGun.position.set(.25,-.2,-.4);
camera.add(playerGun);
scene.add(camera); // camera作为根节点加入场景，让gun可见

scene.add(new THREE.HemisphereLight(0xcfe8ff,0x3a5f3a,.9));
const sun=new THREE.DirectionalLight(0xfff2cc,.9);sun.position.set(500,800,300);scene.add(sun);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(MAP,MAP),new THREE.MeshLambertMaterial({color:0x3e6b35}));
ground.rotation.x=-Math.PI/2;scene.add(ground);
// 边界围栏提示
const borderGeo=new THREE.EdgesGeometry(new THREE.PlaneGeometry(MAP,MAP));
const border=new THREE.LineSegments(borderGeo,new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.25}));
border.rotation.x=-Math.PI/2;border.position.y=2;scene.add(border);

// 毒墙
const zoneWall=new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,300,64,1,true),
  new THREE.MeshBasicMaterial({color:0x3f8cff,transparent:true,opacity:.18,side:THREE.DoubleSide,depthWrite:false}));
zoneWall.position.y=150;scene.add(zoneWall);

// 树和岩石 — 掩体
const obstacles=[];
{
  const trunkG=new THREE.CylinderGeometry(1.2,1.6,10,6),trunkM=new THREE.MeshLambertMaterial({color:0x6b4a2b});
  const leafG=new THREE.ConeGeometry(7,18,7),leafM=new THREE.MeshLambertMaterial({color:0x2e5a2e});
  const rockG=new THREE.DodecahedronGeometry(4),rockM=new THREE.MeshLambertMaterial({color:0x5a5a62});
  // 增加掩体数量：树 350 + 岩石 150 = 500
  for(let i=0;i<500;i++){
    const x=rand(-MAP/2+40,MAP/2-40),z=rand(-MAP/2+40,MAP/2-40);
    if(Math.random()<.7){
      const t=new THREE.Group();
      const tr=new THREE.Mesh(trunkG,trunkM);tr.position.y=5;
      const lf=new THREE.Mesh(leafG,leafM);lf.position.y=17;lf.scale.setScalar(rand(.8,1.6));
      t.add(tr,lf);t.position.set(x,0,z);scene.add(t);
      // 树有碰撞体积，半径增大到 4
      obstacles.push({x,z,r:4,type:'tree'});
    }else{
      const r=new THREE.Mesh(rockG,rockM);r.position.set(x,2,z);r.scale.setScalar(rand(.6,1.8));scene.add(r);
      // 岩石碰撞半径根据缩放动态计算
      const s=r.scale.x;
      obstacles.push({x,z,r:4*s,type:'rock'});
    }
  }
}

// 新增：房屋掩体 — 用简单盒子模拟
const houseObstacles=[];
{
  const wallMat=new THREE.MeshLambertMaterial({color:0x8a7a6a});
  const roofMat=new THREE.MeshLambertMaterial({color:0x5a3a2a});
  // 地图中央小村庄：3x3网格，间距120，覆盖-180到180
  const villageHouses=[];
  for(let ix=-1;ix<=1;ix++)for(let iz=-1;iz<=1;iz++){
    villageHouses.push({x:ix*120,z:iz*120});
    // 每栋房子旁边再随机加1-2栋附属小屋
    if(Math.random()<.6)villageHouses.push({x:ix*120+rand(-50,50),z:iz*120+rand(-50,50)});
    if(Math.random()<.4)villageHouses.push({x:ix*120+rand(-50,50),z:iz*120+rand(-50,50)});
  }
  // 地图中距离区域：半径400-700的环形带
  const midRingHouses=[];
  for(let i=0;i<18;i++){
    const angle=rand(0,Math.PI*2);
    const dist=rand(400,700);
    midRingHouses.push({x:Math.cos(angle)*dist,z:Math.sin(angle)*dist});
  }
  // 地图边缘：半径800-1100
  const edgeHouses=[];
  for(let i=0;i<10;i++){
    const angle=rand(0,Math.PI*2);
    const dist=rand(800,1100);
    edgeHouses.push({x:Math.cos(angle)*dist,z:Math.sin(angle)*dist});
  }
  const allHouses=[...villageHouses,...midRingHouses,...edgeHouses];
  for(const hp of allHouses){
    const w=rand(8,16),d=rand(8,16),h=rand(5,9);
    const g=new THREE.Group();
    const wallThick=0.8;
    const fw=new THREE.Mesh(new THREE.BoxGeometry(w,h,wallThick),wallMat);
    fw.position.set(0,h/2,-d/2);g.add(fw);
    const bw=new THREE.Mesh(new THREE.BoxGeometry(w,h,wallThick),wallMat);
    bw.position.set(0,h/2,d/2);g.add(bw);
    const lw=new THREE.Mesh(new THREE.BoxGeometry(wallThick,h,d),wallMat);
    lw.position.set(-w/2,h/2,0);g.add(lw);
    const rw=new THREE.Mesh(new THREE.BoxGeometry(wallThick,h,d),wallMat);
    rw.position.set(w/2,h/2,0);g.add(rw);
    const roof=new THREE.Mesh(new THREE.BoxGeometry(w+2,0.5,d+2),roofMat);
    roof.position.y=h;g.add(roof);
    const floor=new THREE.Mesh(new THREE.BoxGeometry(w-1,0.3,d-1),
      new THREE.MeshLambertMaterial({color:0x6a5a4a}));
    floor.position.y=0.15;g.add(floor);
    g.position.set(hp.x,0,hp.z);scene.add(g);
    houseObstacles.push({x:hp.x,z:hp.z,hw:w/2+1,hd:d/2+1,h:h,type:'house'});
  }
}

// 新增：车辆掩体
const vehicleObstacles=[];
{
  const carBodyMat=new THREE.MeshLambertMaterial({color:0x4a6a8a});
  const carWindowMat=new THREE.MeshLambertMaterial({color:0x88bbdd,transparent:true,opacity:.5});
  const truckBodyMat=new THREE.MeshLambertMaterial({color:0x5a5a4a});
  const truckCargoMat=new THREE.MeshLambertMaterial({color:0x4a4a3a});
  const carColors=[0xc62828,0x1565c0,0x2e7d32,0xf57f17,0x6a1b9a,0x00838f,0x4e34ce,0xbf360c];
  // 沿道路/区域散布车辆
  const vehiclePositions=[];
  for(let i=0;i<30;i++){
    const angle=rand(0,Math.PI*2);
    const dist=rand(200,1800);
    vehiclePositions.push({x:Math.cos(angle)*dist,z:Math.sin(angle)*dist});
  }
  for(const vp of vehiclePositions){
    const g=new THREE.Group();
    const isTruck=Math.random()<.35;
    const bodyMat=isTruck?truckBodyMat:carBodyMat[(Math.random()*carBodyMat.length)|0];
    if(isTruck){
      // 卡车：车体+货箱
      const cab=new THREE.Mesh(new THREE.BoxGeometry(2.4,2.2,2.5),bodyMat);
      cab.position.set(0,1.4,1.2);g.add(cab);
      const cargo=new THREE.Mesh(new THREE.BoxGeometry(2.4,2,3.5),truckCargoMat);
      cargo.position.set(0,1.4,-1.3);g.add(cargo);
      // 车窗
      const windshield=new THREE.Mesh(new THREE.BoxGeometry(2.2,1.2,0.1),carWindowMat);
      windshield.position.set(0,2,2.45);g.add(windshield);
    }else{
      // 小轿车：车身+车顶
      const body=new THREE.Mesh(new THREE.BoxGeometry(2.2,1,4.5),bodyMat);
      body.position.set(0,0.8,0);g.add(body);
      const roof=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.8,2.2),bodyMat);
      roof.position.set(0,1.7,-0.2);g.add(roof);
      // 车窗
      const windshield=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.7,0.1),carWindowMat);
      windshield.position.set(0,1.5,1.15);g.add(windshield);
      const rearWindow=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.7,0.1),carWindowMat);
      rearWindow.position.set(0,1.5,-1.15);g.add(rearWindow);
    }
    // 轮子
    const wheelG=new THREE.CylinderGeometry(.4,.4,.3,8);
    const wheelMat=new THREE.MeshLambertMaterial({color:0x111111});
    const wheelPositions=[[-1.1,.4,1.4],[1.1,.4,1.4],[-1.1,.4,-1.4],[1.1,.4,-1.4]];
    for(const [wx,wy,wz] of wheelPositions){
      const wheel=new THREE.Mesh(wheelG,wheelMat);
      wheel.rotation.z=Math.PI/2;wheel.position.set(wx,wy,wz);g.add(wheel);
    }
    g.position.set(vp.x,0,vp.z);
    // 随机旋转
    g.rotation.y=rand(0,6.28);
    scene.add(g);
    // 车辆碰撞体（旋转后的矩形）
    const vw=isTruck?5:3.5, vd=isTruck?5:4;
    vehicleObstacles.push({x:vp.x,z:vp.z,hw:vw/2+0.5,hd:vd/2+0.5,h:isTruck?3.4:2.2,type:'vehicle',rot:g.rotation.y});
  }
}

// ================= 游戏状态 =================
let bots=[],bullets3d=[],tracers=[],loots=[],feedArr=[];
let gameOn=false,zonePhase=0,zoneTimer=0,msgT=0,lastT=0,aliveCount=BOTN+1;
const zone={x:0,z:0,r:MAP*0.72,tx:0,tz:0,tr:MAP*0.72,shrinking:false,sx:0,sz:0,sr:0};

const player={
  pos:new THREE.Vector3(0,2.5,0),vel:new THREE.Vector3(),yaw:0,pitch:0,
  hp:100,alive:true,weapon:"pistol",ammo:WEAPONS.pistol.mag,reloadT:0,fireT:0,kills:0,speed:9,
  isPlayer:true,x:0,z:0, // x/z 镜像供 AI 使用
  // 跳跃物理
  vy:0, // 垂直速度
  onGround:true,
  // 瞄准
  aiming:false,
  baseFOV:75,
  aimFOV:35,
  aimTransition:0, // 0=未瞄准, 1=完全瞄准
};

// ---------------- 人机 ----------------
// 巨无霸：身体4x宽x5x高x2x厚，总高约8单位，远处也清晰可见
const bodyG=new THREE.BoxGeometry(3.5,4.5,1.8),headG=new THREE.BoxGeometry(1.5,1.5,1.5),gunG=new THREE.BoxGeometry(.25,.25,2.5);
const hpBarG=new THREE.PlaneGeometry(3.5,.4);
function makeBot(x,z){
  const g=new THREE.Group();
  const body=new THREE.Mesh(bodyG,new THREE.MeshLambertMaterial({color:0xe53935,emissive:0x660000,emissiveIntensity:.35}));body.position.y=3.0;
  const head=new THREE.Mesh(headG,new THREE.MeshLambertMaterial({color:0xd7a37a}));head.position.y=6.2;
  const gun=new THREE.Mesh(gunG,new THREE.MeshLambertMaterial({color:0x111111}));gun.position.set(1.0,3.2,-1.5);
  const hpBg=new THREE.Mesh(hpBarG,new THREE.MeshBasicMaterial({color:0x111111}));
  const hpFg=new THREE.Mesh(hpBarG,new THREE.MeshBasicMaterial({color:0x7cfc00}));
  hpBg.position.y=7.8;hpFg.position.y=7.85;
  g.add(body,head,gun,hpBg,hpFg);
  g.position.set(x,0,z);scene.add(g);
  const w=Math.random()<.4?"pistol":LOOT[(Math.random()*LOOT.length)|0];
  return {x,z,yaw:rand(0,6.28),hp:100,alive:true,weapon:w,ammo:WEAPONS[w].mag,reloadT:0,fireT:0,
    speed:rand(6.5,8.5),kills:0,isPlayer:false,mesh:g,hpFg,hpBg,
    state:"roam",target:null,wx:x,wz:z,thinkT:rand(0,300),strafe:Math.random()<.5?1:-1,
    skill:rand(.25,.45),fleeHp:rand(30,50),burstT:0,lastAttacker:null,vx:0,vz:0};
}

function reset(){

  for(const t of tracers){scene.remove(t.line);t.line.geometry.dispose();t.line.material.dispose();}
  bots=[];loots=[];tracers=[];feedArr=[];zonePhase=0;zoneTimer=0;aliveCount=BOTN+1;
  Object.assign(zone,{x:0,z:0,r:MAP*0.72,tx:0,tz:0,tr:MAP*0.72,shrinking:false});
  player.hp=100;player.alive=true;player.weapon="pistol";player.ammo=WEAPONS.pistol.mag;
  player.reloadT=0;player.kills=0;
  player.pos.set(rand(-200,200),1.7,rand(-200,200));player.yaw=rand(0,6.28);player.pitch=0;
  player.vy=0;player.onGround=true;player.aiming=false;player.aimTransition=0;
  for(let i=0;i<BOTN;i++){
    let x,z;do{x=rand(-MAP/2+40,MAP/2-40);z=rand(-MAP/2+40,MAP/2-40);}while(d2(x,z,player.pos.x,player.pos.z)<200*200);
    bots.push(makeBot(x,z));
  }
  for(let i=0;i<60;i++)spawnLoot(rand(-MAP/2+40,MAP/2-40),rand(-MAP/2+40,MAP/2-40),LOOT[(Math.random()*LOOT.length)|0]);
  updateHUD();
}

// 递归释放 Mesh 的 geometry 和 material
function disposeMesh(mesh){
  mesh.traverse(child=>{
    if(child.geometry)child.geometry.dispose();
    if(child.material){
      if(Array.isArray(child.material))child.material.forEach(m=>m.dispose());
      else child.material.dispose();
    }
  });
}
const lootG=new THREE.BoxGeometry(1,.5,.5);
function spawnLoot(x,z,w){
  const m=new THREE.Mesh(lootG,new THREE.MeshLambertMaterial({color:WEAPONS[w].color,emissive:WEAPONS[w].color,emissiveIntensity:.35}));
  m.position.set(x,1,z);scene.add(m);loots.push({x,z,w,mesh:m});
}

// ---------------- 碰撞检测（空间网格加速） ----------------
// 空间网格：将地图划分为 CELL_SIZE×CELL_SIZE 的格子，碰撞时只查附近格子
const CELL_SIZE=20;
const gridCols=Math.ceil(MAP/CELL_SIZE), gridRows=Math.ceil(MAP/CELL_SIZE);
const grid=new Array(gridCols*gridRows); // 每个格子存 {type:'circle'|'rect', ...} 列表
function gridKey(cx,cz){const ix=Math.floor(cx/CELL_SIZE),iz=Math.floor(cz/CELL_SIZE);if(ix<0||iz<0||ix>=gridCols||iz>=gridRows)return -1;return iz*gridCols+ix;}
function gridInsert(cx,cz,obj){const k=gridKey(cx,cz);if(k<0)return;if(!grid[k])grid[k]=[];grid[k].push(obj);}
function gridClear(){for(let i=0;i<grid.length;i++)grid[i]=null;}

// 构建空间网格（所有掩体静态不动，只需建一次）
(function buildGrid(){
  for(const o of obstacles){
    const cx=o.x, cz=o.z;
    const r2=(o.r+2)*(o.r+2); // 膨胀2单位覆盖相邻格子
    const minI=Math.max(0,Math.floor((cx-r2)/CELL_SIZE));
    const maxI=Math.min(gridCols-1,Math.floor((cx+r2)/CELL_SIZE));
    const minJ=Math.max(0,Math.floor((cz-r2)/CELL_SIZE));
    const maxJ=Math.min(gridRows-1,Math.floor((cz+r2)/CELL_SIZE));
    for(let j=minJ;j<=maxJ;j++)for(let i=minI;i<=maxI;i++)gridInsert(i*CELL_SIZE,j*CELL_SIZE,o);
  }
  for(const h of houseObstacles){
    const minI=Math.floor((h.x-h.hw)/CELL_SIZE);
    const maxI=Math.floor((h.x+h.hw)/CELL_SIZE);
    const minJ=Math.floor((h.z-h.hd)/CELL_SIZE);
    const maxJ=Math.floor((h.z+h.hd)/CELL_SIZE);
    for(let j=Math.max(0,minJ);j<=Math.min(gridRows-1,maxJ);j++)for(let i=Math.max(0,minI);i<=Math.min(gridCols-1,maxI);i++)gridInsert(i*CELL_SIZE,j*CELL_SIZE,h);
  }
  for(const v of vehicleObstacles){
    const minI=Math.floor((v.x-v.hw)/CELL_SIZE);
    const maxI=Math.floor((v.x+v.hw)/CELL_SIZE);
    const minJ=Math.floor((v.z-v.hd)/CELL_SIZE);
    const maxJ=Math.floor((v.z+v.hd)/CELL_SIZE);
    for(let j=Math.max(0,minJ);j<=Math.min(gridRows-1,maxJ);j++)for(let i=Math.max(0,minI);i<=Math.min(gridCols-1,maxI);i++)gridInsert(i*CELL_SIZE,j*CELL_SIZE,v);
  }
})();

// 从网格中收集候选掩体（去重）
function gridCollectCandidates(cx,cz,maxDist){
  const result=[];
  const seen=new Set();
  const minI=Math.max(0,Math.floor((cx-maxDist)/CELL_SIZE));
  const maxI=Math.min(gridCols-1,Math.floor((cx+maxDist)/CELL_SIZE));
  const minJ=Math.max(0,Math.floor((cz-maxDist)/CELL_SIZE));
  const maxJ=Math.min(gridRows-1,Math.floor((cz+maxDist)/CELL_SIZE));
  for(let j=minJ;j<=maxJ;j++)for(let i=minI;i<=maxI;i++){
    const cell=grid[j*gridCols+i];
    if(!cell)continue;
    for(const o of cell){
      const id=Object.is(o,o)?o:null; // 稳定引用
      if(!seen.has(id)){seen.add(id);result.push(o);}
    }
  }
  return result;
}

// 检查一个点是否与附近掩体碰撞（通过空间网格加速）
function checkObstacleCollision(x,z,radius){
  // 只收集半径 radius+2 范围内的候选
  const candidates=gridCollectCandidates(x,z,radius+10);
  for(const o of candidates){
    if(o.type==='tree'||o.type==='rock'){
      const dx=x-o.x, dz=z-o.z;
      const minDist=o.r+radius;
      const minDist2=minDist*minDist;
      if(dx*dx+dz*dz<minDist2){
        const dist=Math.sqrt(dx*dx+dz*dz);
        if(dist>0.01){
          const pushAngle=Math.atan2(dz,dx);
          return {blocked:true,pushX:Math.cos(pushAngle),pushZ:Math.sin(pushAngle),pushDist:minDist-dist};
        }
        return {blocked:true,pushX:1,pushZ:0,pushDist:minDist};
      }
    }else if(o.type==='house'){
      const dx=x-o.x, dz=z-o.z;
      if(Math.abs(dx)<o.hw+radius && Math.abs(dz)<o.hd+radius){
        const overlapX=o.hw+radius-Math.abs(dx);
        const overlapZ=o.hd+radius-Math.abs(dz);
        if(overlapX<overlapZ)return {blocked:true,pushX:dx>0?1:-1,pushZ:0,pushDist:overlapX};
        return {blocked:true,pushX:0,pushZ:dz>0?1:-1,pushDist:overlapZ};
      }
    }else if(o.type==='vehicle'){
      const dx=x-o.x, dz=z-o.z;
      const cos=Math.cos(-o.rot),sin=Math.sin(-o.rot);
      const localX=dx*cos-dz*sin,localZ=dx*sin+dz*cos;
      if(Math.abs(localX)<o.hw+radius && Math.abs(localZ)<o.hd+radius){
        const overlapX=o.hw+radius-Math.abs(localX);
        const overlapZ=o.hd+radius-Math.abs(localZ);
        if(overlapX<overlapZ){
          const wcos=Math.cos(o.rot),wsin=Math.sin(o.rot);
          const sign=localX>0?1:-1;
          return {blocked:true,pushX:wcos*sign,pushZ:wsin*sign,pushDist:overlapX};
        }
        const wcos=Math.cos(o.rot+Math.PI/2),wsin=Math.sin(o.rot+Math.PI/2);
        const sign=localZ>0?1:-1;
        return {blocked:true,pushX:wcos*sign,pushZ:wsin*sign,pushDist:overlapZ};
      }
    }
  }
  return {blocked:false};
}

// 检查从(x1,z1)到(x2,z2)的直线是否与掩体碰撞（用于子弹）
// 优化：只对近距离子弹检测，远距离直接忽略
function lineObstacleBlocked(x1,z1,x2,z2){
  const dist=Math.sqrt(d2(x1,z1,x2,z2));
  if(dist<15)return false; // 太短不需要检测
  // 最大检测距离 200（近距离武器自动命中，远距离武器采样稀疏）
  const maxCheckDist=200;
  const steps=Math.min(Math.ceil(dist/6),Math.ceil(maxCheckDist/6));
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    const cx=x1+(x2-x1)*t;
    const cz=z1+(z2-z1)*t;
    // 用网格只查附近掩体
    const candidates=gridCollectCandidates(cx,cz,6);
    for(const o of candidates){
      if(o.type==='tree'||o.type==='rock'){
        if(d2(cx,cz,o.x,o.z)<(o.r*0.7)*(o.r*0.7))return true;
      }else if(o.type==='house'){
        if(Math.abs(cx-o.x)<o.hw*0.85 && Math.abs(cz-o.z)<o.hd*0.85)return true;
      }else if(o.type==='vehicle'){
        const dx=cx-o.x,dz=cz-o.z;
        const cos=Math.cos(-o.rot),sin=Math.sin(-o.rot);
        const lx=dx*cos-dz*sin,lz=dx*sin+dz*cos;
        if(Math.abs(lx)<o.hw*0.8 && Math.abs(lz)<o.hd*0.8)return true;
      }
    }
  }
  return false;
}

// ---------------- 射击 ----------------
const raycaster=new THREE.Raycaster();
function playerShoot(now){
  const W=WEAPONS[player.weapon];
  if(player.reloadT>0||now<player.fireT)return;
  if(player.ammo<=0){startReload(player);return;}
  player.fireT=now+W.rof;player.ammo--;
  const n=W.pellets||1;
  for(let i=0;i<n;i++){
    const dir=new THREE.Vector3(rand(-W.spread,W.spread),rand(-W.spread,W.spread),-1)
      .applyQuaternion(camera.quaternion).normalize();
    raycaster.set(camera.position.clone(),dir);raycaster.far=W.range;
    const meshes=[];
    for(const b of bots)if(b.alive)meshes.push(b.mesh);
    const hits=raycaster.intersectObjects(meshes,true);
    let end=camera.position.clone().add(dir.clone().multiplyScalar(W.range));
    if(hits.length){
      let b=bots.find(bb=>{let f=false;bb.mesh.traverse(o=>{if(o===hits[0].object)f=true;});return f;});
      end=hits[0].point;
      if(b){damage(b,W.dmg,player);hitmarker();}
    }
    // 弹道曳光：从枪口附近到命中点，红色表示玩家子弹
    const gunOffset=new THREE.Vector3(.3,.15,-.5).applyQuaternion(camera.quaternion);
    const gunPos=camera.position.clone().add(gunOffset);
    addTracer(gunPos,end,0xffe082);
  }
  updateHUD();
}
function botShoot(b,t,now){
  const W=WEAPONS[b.weapon];
  if(b.reloadT>0||now<b.fireT)return;
  if(b.ammo<=0){startReload(b);return;}
  b.fireT=now+W.rof;b.ammo--;
  const tx=t.x??t.pos.x,tz=t.z??t.pos.z;
  const d=Math.sqrt(d2(b.x,b.z,tx,tz));
  // 命中率：非常低
  const moving=Math.hypot(t.vx||0,t.vz||0)>3|| (t.isPlayer&&(keys['KeyW']||keys['KeyA']||keys['KeyS']||keys['KeyD']));
  let p=b.skill*clamp(.6-d/W.range,.02,.4)*(moving?.45:1)*(t.isPlayer?.75:1);
  if(d<W.range*.3)p*=.6;
  // 枪口位置（巨无霸bot）
  const from=new THREE.Vector3(b.x,3.2,b.z);
  const blocked=lineObstacleBlocked(b.x,b.z,tx,tz);
  if(blocked)p*=0.15;
  p=Math.min(p,.35);
  const hit=Math.random()<p;
  let to;
  if(hit&&!blocked){
    damage(t,W.dmg,b);
    to=new THREE.Vector3(tx,3.0,tz);
  }else if(hit&&blocked){
    const hitPoint=findObstacleHitPoint(b.x,b.z,tx,tz);
    to=hitPoint;
    addTracer(from,to,0xffe082);
  }else{
    to=new THREE.Vector3(tx+rand(-8,8),rand(0,5),tz+rand(-8,8));
  }
  addTracer(from,to,0xff5252);
}

// 找到子弹击中掩体的位置（用网格加速，且只检测前200单位）
function findObstacleHitPoint(x1,z1,x2,z2){
  const dx=x2-x1,dz=z2-z1;
  const dist=Math.sqrt(dx*dx+dz*dz);
  const maxCheckDist=200;
  const steps=Math.min(Math.ceil(maxCheckDist/3),Math.ceil(dist/3));
  for(let i=1;i<=steps;i++){
    const t=i/steps;
    const cx=x1+dx*t,cz=z1+dz*t;
    const candidates=gridCollectCandidates(cx,cz,5);
    for(const o of candidates){
      if(o.type==='tree'||o.type==='rock'){
        if(d2(cx,cz,o.x,o.z)<(o.r*0.7)*(o.r*0.7))return new THREE.Vector3(cx,1.2,cz);
      }else if(o.type==='house'){
        if(Math.abs(cx-o.x)<o.hw*0.85 && Math.abs(cz-o.z)<o.hd*0.85)return new THREE.Vector3(cx,1.2,cz);
      }else if(o.type==='vehicle'){
        const vdx=cx-o.x,vdz=cz-o.z;
        const cos=Math.cos(-o.rot),sin=Math.sin(-o.rot);
        const lx=vdx*cos-vdz*sin,lz=vdx*sin+vdz*cos;
        if(Math.abs(lx)<o.hw*0.8 && Math.abs(lz)<o.hd*0.8)return new THREE.Vector3(cx,1.2,cz);
      }
    }
  }
  return new THREE.Vector3(x2,1.2,z2);
}

// 曳光弹对象池 — 弹道红色轨迹：从起点到终点画一条红色长线（尾巴），在命中点画一个亮色点（弹头）
// 用两个Line对象：红色长尾 + 亮色弹头
const tracerPool=[];
const TRACER_POOL_SIZE=512;
(function initTracerPool(){
  for(let i=0;i<TRACER_POOL_SIZE;i++){
    const g=new THREE.BufferGeometry();
    const m=new THREE.LineBasicMaterial({transparent:true,opacity:1.0});
    const l=new THREE.Line(g,m);
    l.visible=false;
    scene.add(l);
    tracerPool.push({line:l,geo:g,mat:m});
  }
})();
let tracerPoolIdx=0;

// 红色弹道尾巴（长线）
function addTrail(a,b,color){
  let slot;
  if(tracerPoolIdx<tracerPool.length){
    slot=tracerPool[tracerPoolIdx++];
  }else{
    const g=new THREE.BufferGeometry();
    const m=new THREE.LineBasicMaterial({color,transparent:true,opacity:1.0});
    const l=new THREE.Line(g,m);
    scene.add(l);
    slot={line:l,geo:g,mat:m};
  }
  // 红色尾巴：从起点向后延伸一段距离，到命中点
  const dx=b.x-a.x,dz=b.z-a.z;
  const dist=Math.sqrt(dx*dx+dz*dz);
  const extend=Math.min(dist*.3,80); // 尾巴长度：30%弹道或最多80单位
  const tailEnd=new THREE.Vector3(
    b.x-dx/dist*extend,
    b.y-(b.y-a.y)/dist*extend,
    b.z-dz/dist*extend
  );
  slot.geo.setFromPoints([a,tailEnd]);
  slot.mat.color.setHex(color||0xff2200); // 红色
  slot.mat.opacity=1.0;
  slot.line.visible=true;
  tracers.push({line:slot.line,t:performance.now()+200,slot});
}

// 弹头亮点（短线，亮色）
function addHead(a,b,color){
  let slot;
  if(tracerPoolIdx<tracerPool.length){
    slot=tracerPool[tracerPoolIdx++];
  }else{
    const g=new THREE.BufferGeometry();
    const m=new THREE.LineBasicMaterial({color,transparent:true,opacity:1.0});
    const l=new THREE.Line(g,m);
    scene.add(l);
    slot={line:l,geo:g,mat:m};
  }
  // 弹头：命中点附近的一小段
  const dx=b.x-a.x,dz=b.z-a.z;
  const dist=Math.sqrt(dx*dx+dz*dz)||1;
  const headLen=Math.min(dist*.08,5);
  const headStart=new THREE.Vector3(
    b.x-dx/dist*headLen,
    b.y-(b.y-a.y)/dist*headLen,
    b.z-dz/dist*headLen
  );
  slot.geo.setFromPoints([headStart,b]);
  slot.mat.color.setHex(color||0xffe082);
  slot.mat.opacity=1.0;
  slot.line.visible=true;
  tracers.push({line:slot.line,t:performance.now()+200,slot});
}

// 统一接口：红色弹道轨迹
function addTracer(a,b,color){
  // 红色尾巴
  addTrail(a,b,color);
  // 亮色弹头
  addHead(a,b,color);
}

function damage(e,d,src){
  if(!e.alive)return;
  e.hp-=d;e.lastAttacker=src;
  if(e.isPlayer){
    document.getElementById('dmgv').style.opacity=.9;
    setTimeout(()=>document.getElementById('dmgv').style.opacity=0,200);
  }else{
    e.hpFg.scale.x=Math.max(0,e.hp)/100;
    e.hpFg.position.x=-.7*(1-Math.max(0,e.hp)/100);
  }
  if(e.hp<=0){
    e.alive=false;src.kills++;
    aliveCount--; // 存活数递减
    if(!e.isPlayer){
      scene.remove(e.mesh);
      disposeMesh(e.mesh);
      if(Math.random()<.5)spawnLoot(e.x,e.z,Math.random()<.3?"sniper":LOOT[(Math.random()*LOOT.length)|0]);
    }
    const an=src.isPlayer?"你":src._zone?"毒圈":"人机",bn=e.isPlayer?"你":"人机";
    feedArr.unshift(`${an} ▸ ${bn}`);if(feedArr.length>6)feedArr.pop();
    document.getElementById('feed').innerHTML=feedArr.join("<br>");
    if(e.isPlayer)endGame(false);
    else if(src.isPlayer){showMsg(`击杀 +1（共 ${src.kills}）`);}
  }
  updateHUD();
}
function hitmarker(){const h=document.getElementById('hitm');h.style.opacity=1;setTimeout(()=>h.style.opacity=0,90);}
function showMsg(t){const m=document.getElementById('msg');m.textContent=t;msgT=performance.now()+2200;}

// ---------------- 人机 AI ----------------
function botThink(b,now){
  if(now<b.thinkT)return;
  b.thinkT=now+rand(160,300);
  const W=WEAPONS[b.weapon];
  const zr=zone.shrinking?zone.tr:zone.r;
  const dz=Math.hypot(b.x-zone.x,b.z-zone.z);
  // 找敌人：玩家 + 抽样人机，谁近打谁；被打了优先报复
  let target=null,bd=Math.max(200,W.range*0.9)**2*1.2;
  if(player.alive){const dd=d2(b.x,b.z,player.pos.x,player.pos.z);if(dd<bd){bd=dd;target=player;}}
  for(let i=0;i<20;i++){
    const o=bots[(Math.random()*bots.length)|0];
    if(o!==b&&o.alive){const dd=d2(b.x,b.z,o.x,o.z);if(dd<bd){bd=dd;target=o;}}
  }
  if(b.lastAttacker&&b.lastAttacker.alive&&Math.random()<.6){
    const la=b.lastAttacker,lx=la.x??la.pos.x,lz=la.z??la.pos.z;
    if(d2(b.x,b.z,lx,lz)<bd*1.6)target=la;
  }
  b.target=target;
  if(dz>zr*.92){b.state="zone";b.wx=zone.x+rand(-zr,zr)*.45;b.wz=zone.z+rand(-zr,zr)*.45;return;}
  if(target){
    const tx=target.x??target.pos.x,tz=target.z??target.pos.z;
    const d=Math.sqrt(d2(b.x,b.z,tx,tz));
    if(b.hp<b.fleeHp&&d<W.range*.6&&Math.random()<b.skill){
      b.state="flee";const a=Math.atan2(b.z-tz,b.x-tx);
      b.wx=clamp(b.x+Math.cos(a)*120,-MAP/2+20,MAP/2-20);b.wz=clamp(b.z+Math.sin(a)*120,-MAP/2+20,MAP/2-20);
    }else if(d>W.range*.55)b.state="chase";
    else{b.state="fight";if(Math.random()<.3)b.strafe*=-1;}
  }else{
    if(b.weapon==="pistol"||Math.random()<.25){
      let best=null,ld=300*300;
      for(const l of loots){const dd=d2(l.x,l.z,b.x,b.z);if(dd<ld){ld=dd;best=l;}}
      if(best){b.state="loot";b.lt=best;b.wx=best.x;b.wz=best.z;return;}
    }
    b.state="roam";
    if(d2(b.x,b.z,b.wx,b.wz)<100){b.wx=zone.x+rand(-zr,zr)*.65;b.wz=zone.z+rand(-zr,zr)*.65;}
  }
}

function botAct(b,dt,now){
  botThink(b,now);
  const W=WEAPONS[b.weapon];
  let mx=0,mz=0;
  const t=b.target&&b.target.alive?b.target:null;
  if(!t&&b.state!=="zone"&&(b.state==="fight"||b.state==="chase"))b.state="roam";
  if(b.state==="fight"&&t){
    const tx=t.x??t.pos.x,tz=t.z??t.pos.z;
    const d=Math.sqrt(d2(b.x,b.z,tx,tz))||1;
    // 转向目标（带技能误差）
    const want=Math.atan2(tz-b.z,tx-b.x);
    let diff=want-b.yaw;while(diff>Math.PI)diff-=2*Math.PI;while(diff<-Math.PI)diff+=2*Math.PI;
    b.yaw+=diff*.22;
    // 环绕走位
    const px=-(tz-b.z)/d,pz=(tx-b.x)/d;
    const ideal=W.range*.38,ap=d>ideal?1:-.55;
    mx=(tx-b.x)/d*ap+px*b.strafe*.8;mz=(tz-b.z)/d*ap+pz*b.strafe*.8;
    // 开火（瞄准误差内）
    if(d<W.range*.9&&Math.abs(diff)<.3){
      if(W.auto)botShoot(b,t,now);
      else if(now>b.burstT){botShoot(b,t,now);if(Math.random()<.5)b.burstT=now+rand(250,600);}
    }
    if(b.ammo===0){const a=Math.atan2(b.z-tz,b.x-tx);mx=Math.cos(a);mz=Math.sin(a);}
  }else if(b.state==="chase"&&t){
    const tx=t.x??t.pos.x,tz=t.z??t.pos.z;
    const d=Math.sqrt(d2(b.x,b.z,tx,tz))||1;
    b.yaw+=(Math.atan2(tz-b.z,tx-b.x)-b.yaw)*.15;
    mx=(tx-b.x)/d;mz=(tz-b.z)/d;
    if(d<W.range*.65)b.state="fight";
  }else{
    const d=Math.sqrt(d2(b.x,b.z,b.wx,b.wz));
    if(d>4){mx=(b.wx-b.x)/d;mz=(b.wz-b.z)/d;b.yaw+=(Math.atan2(mz,mx)-b.yaw)*.1;}
    if(b.state==="loot"&&b.lt){
      const idx=loots.indexOf(b.lt);
      if(idx<0){b.state="roam";}
      else if(d<2.5){b.weapon=b.lt.w;b.ammo=WEAPONS[b.lt.w].mag;scene.remove(b.lt.mesh);loots.splice(idx,1);b.state="roam";}
    }
  }
  const sp=b.speed*(b.reloadT>0?.75:1);
  b.vx=mx*sp;b.vz=mz*sp;
  const nx=clamp(b.x+b.vx*dt/1000,-MAP/2+10,MAP/2-10);
  const nz=clamp(b.z+b.vz*dt/1000,-MAP/2+10,MAP/2-10);
  // Bot 碰撞检测
  const col=checkObstacleCollision(nx,nz,0.7);
  if(col.blocked){
    b.x=clamp(b.x+col.pushX*col.pushDist,-MAP/2+10,MAP/2-10);
    b.z=clamp(b.z+col.pushZ*col.pushDist,-MAP/2+10,MAP/2-10);
  }else{
    b.x=nx;b.z=nz;
  }
  b.mesh.position.set(b.x,0,b.z);
  b.mesh.rotation.y=-b.yaw;
  // 血条朝相机
  b.hpFg.lookAt(camera.position);b.hpBg.lookAt(camera.position);
}

// ---------------- 毒圈 ----------------
const PHASES=[{wait:30000,shrink:25000,r:.55},{wait:22000,shrink:20000,r:.35},{wait:18000,shrink:16000,r:.2},{wait:15000,shrink:13000,r:.1},{wait:12000,shrink:11000,r:.04}];
const zoneKiller={isPlayer:false,alive:true,kills:0,_zone:true};
function updateZone(dt){
  zoneTimer+=dt;
  const ph=PHASES[Math.min(zonePhase,PHASES.length-1)];
  const info=document.getElementById('zoneinfo');
  if(!zone.shrinking){
    info.textContent=`毒圈 ${Math.max(0,Math.ceil((ph.wait-zoneTimer)/1000))}s 后收缩`;
    if(zoneTimer>=ph.wait){
      zone.shrinking=true;zoneTimer=0;
      const nr=zone.r*ph.r,off=(zone.r-nr)*.8;
      zone.tx=clamp(zone.x+rand(-off,off),-MAP/2+nr,MAP/2-nr);
      zone.tz=clamp(zone.z+rand(-off,off),-MAP/2+nr,MAP/2-nr);
      zone.tr=nr;zone.sx=zone.x;zone.sz=zone.z;zone.sr=zone.r;
      showMsg("毒圈开始收缩！");
    }
  }else{
    info.textContent="毒圈收缩中！快进圈！";
    const t=Math.min(1,zoneTimer/ph.shrink);
    zone.x=zone.sx+(zone.tx-zone.sx)*t;zone.z=zone.sz+(zone.tz-zone.sz)*t;zone.r=zone.sr+(zone.tr-zone.sr)*t;
    if(t>=1){zone.shrinking=false;zoneTimer=0;zonePhase++;}
  }
  zoneWall.position.x=zone.x;zoneWall.position.z=zone.z;
  zoneWall.scale.set(zone.r,1,zone.r);
  // 圈外伤害
  if(player.alive&&Math.hypot(player.pos.x-zone.x,player.pos.z-zone.z)>zone.r){
    player.zoneAcc=(player.zoneAcc||0)+dt;
    if(player.zoneAcc>600){player.zoneAcc=0;damage(player,4+zonePhase*2,zoneKiller);showMsg("你在毒圈外！");}
  }
  for(const b of bots){
    if(!b.alive)continue;
    if(Math.hypot(b.x-zone.x,b.z-zone.z)>zone.r){
      b.zoneAcc=(b.zoneAcc||0)+dt;
      if(b.zoneAcc>600){b.zoneAcc=0;damage(b,4+zonePhase*2,zoneKiller);}
    }
  }
}

// ---------------- 主循环 ----------------
function loop(now){
  if(!gameOn)return;
  const dt=Math.min(50,now-lastT);lastT=now;
  // 玩家移动
  if(player.alive){
    const f=(keys['KeyW']?1:0)-(keys['KeyS']?1:0),s=(keys['KeyD']?1:0)-(keys['KeyA']?1:0);
    const run=keys['ShiftLeft']||keys['ShiftRight']?1.5:1;
    const sp=player.speed*run*(player.reloadT>0?.85:1);
    const sin=Math.sin(player.yaw),cos=Math.cos(player.yaw);
    player.vel.set((s*cos-f*sin)*sp,0,(-f*cos-s*sin)*sp);

    // 计算新位置
    let nx=player.pos.x+player.vel.x*dt/1000;
    let nz=player.pos.z+player.vel.z*dt/1000;
    nx=clamp(nx,-MAP/2+8,MAP/2-8);
    nz=clamp(nz,-MAP/2+8,MAP/2-8);

    // 玩家碰撞检测
    const col=checkObstacleCollision(nx,nz,0.6);
    if(col.blocked){
      player.pos.x=clamp(player.pos.x+col.pushX*col.pushDist,-MAP/2+8,MAP/2-8);
      player.pos.z=clamp(player.pos.z+col.pushZ*col.pushDist,-MAP/2+8,MAP/2-8);
    }else{
      player.pos.x=nx;
      player.pos.z=nz;
    }

    // 跳跃物理：重力和垂直速度
    if(!player.onGround){
      player.vy-=18*dt/1000; // 重力加速度 18 m/s^2
      player.pos.y+=player.vy*dt/1000;
      if(player.pos.y<=2.0){
        player.pos.y=2.0;
        player.vy=0;
        player.onGround=true;
      }
    }

    player.x=player.pos.x;player.z=player.pos.z;
    player.vx=player.vel.x;player.vz=player.vel.z;
    camera.position.copy(player.pos);

    // 瞄准时相机后移 + FOV 变化
    if(player.aiming){
      // 平滑过渡
      player.aimTransition=clamp(player.aimTransition+dt/400,0,1);
    }else{
      player.aimTransition=clamp(player.aimTransition-dt/300,0,1);
    }
    const t=player.aimTransition;
    camera.fov=THREE.MathUtils.lerp(player.baseFOV,player.aimFOV,t);
    camera.updateProjectionMatrix();

    // 瞄准时相机位置后移
    const aimOffset=t*0.5; // 后移距离
    const right=new THREE.Vector3(-sin,0,cos);
    const forward=new THREE.Vector3(-cos,0,-sin);
    camera.position.add(right.multiplyScalar(aimOffset*0.3));
    camera.position.y+=aimOffset*0.15; // 瞄准时相机略下沉

    camera.rotation.set(0,0,0);camera.rotateY(player.yaw);camera.rotateX(player.pitch);
    if(mouseDown&&document.pointerLockElement)playerShoot(now);
    if(player.reloadT>0){player.reloadT-=dt;if(player.reloadT<=0){player.reloadT=0;player.ammo=WEAPONS[player.weapon].mag;updateHUD();}}
  }
  for(const b of bots)if(b.alive){
    if(b.reloadT>0){b.reloadT-=dt;if(b.reloadT<=0){b.reloadT=0;b.ammo=WEAPONS[b.weapon].mag;}}
    botAct(b,dt,now);
  }
  // 曳光弹清理 — 回收至对象池，限制最大数量防止卡顿
  const maxTracers=200;
  // 回收溢出的池对象
  while(tracerPoolIdx>maxTracers){
    tracerPoolIdx--;
    const s=tracerPool[tracerPoolIdx];
    s.line.visible=false;
    scene.remove(s.line);
  }
  for(let i=tracers.length-1;i>=0;i--){
    if(now>tracers[i].t){
      const entry=tracers[i];
      entry.line.visible=false;
      scene.remove(entry.line);
      // 重置池索引以便复用
      if(entry.slot && tracerPoolIdx>0)tracerPoolIdx--;
      tracers.splice(i,1);
    }
  }
  updateZone(dt);
  document.getElementById('alive').textContent=aliveCount;
  if(aliveCount===1&&player.alive)endGame(true);
  if(msgT&&now>msgT){document.getElementById('msg').textContent='';msgT=0;}
  drawMinimap();
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}

function updateHUD(){
  const W=WEAPONS[player.weapon];
  document.getElementById('wp').textContent=W.name;
  document.getElementById('ammo').textContent=player.reloadT>0?"换弹中…":`${player.ammo}/${W.mag}`;
  document.getElementById('kills').textContent=player.kills;
  const hf=document.getElementById('hpfill');
  hf.style.width=Math.max(0,player.hp)+"%";
  hf.style.background=player.hp>50?"#7CFC00":player.hp>25?"#ffb300":"#ef5350";
}

const mmc=document.getElementById('minimap').getContext('2d');
function drawMinimap(){
  const S=170,k=S/MAP;
  mmc.fillStyle="rgba(0,0,0,.5)";mmc.fillRect(0,0,S,S);
  mmc.strokeStyle="#4fc3f7";mmc.beginPath();
  mmc.arc(S/2+zone.x*k,S/2+zone.z*k,zone.r*k,0,7);mmc.stroke();
  mmc.fillStyle="#ef5350";
  for(const b of bots)if(b.alive)mmc.fillRect(S/2+b.x*k-1,S/2+b.z*k-1,2.5,2.5);
  if(player.alive){mmc.fillStyle="#ffd54a";mmc.beginPath();mmc.arc(S/2+player.pos.x*k,S/2+player.pos.z*k,3.5,0,7);mmc.fill();}
}

function endGame(win){
  gameOn=false;
  document.exitPointerLock&&document.exitPointerLock();
  const o=document.getElementById('overlay');
  o.style.display='flex';
  o.innerHTML=`<h1>${win?"大吉大利，今晚吃鸡！":"你被击杀了"}</h1>
  <p>击杀数：${player.kills} 最终排名：#${win?1:aliveCount}</p>
  <button id="startbtn">再来一局</button>`;
  document.getElementById('startbtn').onclick=()=>{
    o.style.display='none';reset();gameOn=true;lastT=performance.now();
    renderer.domElement.requestPointerLock();requestAnimationFrame(loop);
  };
}
</script>
